<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Подтверждение email</title>
  </head>
  <body style="font-family: Arial, sans-serif; color: #1f2937; padding: 24px">
    <h2 style="margin: 0 0 16px">Подтверждение email</h2>
    <p>Здравствуйте!</p>
    <p>Ваш код подтверждения в Mind IT:</p>
    <p style="font-size: 32px; letter-spacing: 8px; font-weight: bold; margin: 24px 0">
      {{ code }}
    </p>
    <p>Код действует {{ ttl_minutes }} минут.</p>
    <p style="color: #6b7280; font-size: 13px">
      Если вы не регистрировались, просто проигнорируйте это письмо.
    </p>
  </body>
</html>
